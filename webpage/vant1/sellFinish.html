<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>投资游戏</title>
  <link rel="stylesheet" href="./css/index.css">
<style>
	body {
		background-color: #fff;
	}
	
	.title1 {
		margin: 11px 10px 11px 10px;
	}
		
	.body1 {
		color: black;
	}
	
	.foot11 {
		color: black;
	}
</style>
</head>
<body>
<div id="app">
	<div class="title1">
		<van-nav-bar 
			title="卖出完成"
			right-text="主页"
			@click-right="onClickRight"
		/>
	</div>
	<div class="body1">
		<van-cell-group inset>
			<van-cell title="基金名称" :value="sName" />
		</van-cell-group>
		<van-cell-group></van-cell-group>
		<van-cell-group inset>
			<van-cell title="卖出份额" :value="fenE" />
		</van-cell-group>
		<van-cell-group inset>
			<van-cell title="获得金额" :value="jinE" />
		</van-cell-group>
		<van-cell-group inset>
			<van-cell value="点击跳转页面" />
		</van-cell-group>
		<van-cell-group inset>
			<van-cell title="主页" is-link url="gpIndex.html" />
		</van-cell-group>
	</div>
	<div class="foot11">
		
	</div>
</div>
</body>

<script src="./js/vue.min.js"></script>
<script src="./js/vant.min.js"></script>
<script src="./js/axios.min.js"></script>
<script type="text/javascript">

	new Vue({
		el:'#app',
		data(){
			return{
				msg:'abc',
				fenE: 0,
				jinE: 0,
				sName: ''
			}
		},
		created(){
			console.log("created()");
			this.sName = sessionStorage.getItem("buyJJName1");
			console.log("this.sName-=>",this.sName)
			
			this.fenE = sessionStorage.getItem("sellFenE");
			this.jinE = sessionStorage.getItem("sellJinE");
			
		},
		mounted(){
			
		},
		methods:{
			abc(){},
			onClickRight(){
				window.location.href="./gpIndex.html"
			}
		}
	})

</script>
</html>
